<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17222e">
    <title>Sin conexión - Alena Zentrix</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: #17222e;
            background: #ffffff;
            text-align: center;
        }
        main { max-width: 360px; }
        img { width: 96px; height: 96px; border-radius: 20px; }
        h1 { margin: 20px 0 8px; font-size: 1.4rem; }
        p { margin: 0 0 24px; line-height: 1.5; color: #475569; }
        button {
            border: 0;
            border-radius: 10px;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background: #17222e;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <img src="/icons/icon-192.png" alt="Alena Zentrix">
        <h1>Sin conexión</h1>
        <p>No hay internet en este momento. Si estabas llenando un reporte, tu borrador sigue guardado en este dispositivo. Vuelve a intentarlo cuando recuperes la señal.</p>
        <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
</body>
</html>
